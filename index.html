<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e1013">
<title>Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0e1013;--s1:#161a1f;--s2:#1f242b;--tx:#dde1e7;--mu:#7d8692;--ac:#8fd3c3;--ac2:#1c3a35;--danger:#e0766b;--r:16px;
--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.hide{display:none!important}
/* lock */
#lock{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;padding:24px;text-align:center}
#lock .nf h1{font-size:88px;font-weight:200;letter-spacing:-4px;color:#2b3038;user-select:none;padding:8px 24px}
#lock .nf p{color:#454c56;margin-top:4px}
#lock form{display:flex;flex-direction:column;gap:12px;width:min(300px,86vw);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
#lock input{background:var(--s1);border:1px solid var(--s2);border-radius:12px;padding:14px 16px;text-align:center;outline:none;letter-spacing:2px}
#lock input:focus{border-color:var(--ac)}
#lock small{color:var(--mu);min-height:1.2em}
#lock .go{background:var(--ac);color:#0a1411;border-radius:12px;padding:13px;font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
/* app */
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding:calc(var(--safe-t) + 14px) 16px 10px}
.top{display:flex;align-items:baseline;justify-content:space-between}
.top b{font-size:22px;font-weight:600;letter-spacing:-.4px}
.top span{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:7px 15px;border-radius:99px;background:var(--s1);color:var(--mu);white-space:nowrap;transition:background .2s,color .2s}
.tabs button.on{background:var(--ac2);color:var(--ac)}
main{padding:6px 14px calc(110px + var(--safe-b))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--min,150px),1fr));gap:var(--gap,12px)}
.card{position:relative;border-radius:var(--r);overflow:hidden;background:var(--s1);aspect-ratio:3/4;text-align:left;content-visibility:auto;contain-intrinsic-size:200px 266px;transition:transform .18s}
.card:active{transform:scale(.97)}
.card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
.card img.ld{opacity:1}
.card .ph{position:absolute;inset:0;display:grid;place-items:center;color:#3a424c;font-size:34px}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 9px;background:linear-gradient(transparent,rgba(8,10,12,.88));font-size:13px;line-height:1.25;display:flex;justify-content:space-between;gap:6px;align-items:flex-end}
.card .cap i{font-style:normal;color:var(--ac);font-size:11px;flex:none}
.card .cap em{font-style:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{text-align:center;color:var(--mu);padding:90px 20px}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px;font-weight:600}
#add{position:fixed;right:18px;bottom:calc(20px + var(--safe-b));width:58px;height:58px;border-radius:20px;background:var(--ac);color:#0a1411;font-size:30px;font-weight:300;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:6;transition:transform .2s}
#add:active{transform:scale(.92)}
#lockbtn,#setbtn{color:var(--mu);padding:4px 0 4px 14px;font-size:13px}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,20px);background:var(--s2);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:70;font-size:13px;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* viewer */
#view{position:fixed;inset:0;background:#07080a;z-index:30;display:flex;flex-direction:column;animation:fade .22s}
@keyframes fade{from{opacity:0}}
#vbar{display:flex;align-items:center;gap:6px;padding:calc(var(--safe-t) + 8px) 10px 8px;background:rgba(14,16,19,.92);z-index:2}
#vbar h2{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
#vbar button{padding:8px 12px;border-radius:10px;color:var(--mu);font-size:13px}
#vbar .x{color:var(--tx);font-size:20px}
#vbar .del{color:var(--danger)}
#vbody{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;-webkit-overflow-scrolling:touch}
#vbody.center{align-items:center}
#vbody img,#vbody video{max-width:100%;max-height:100%;display:block}
#pages{width:min(100%,900px)}
#pages .pg{position:relative;background:#14171b;margin:0 auto var(--pg,0px)}
#pages canvas{width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;top:0;height:2px;background:var(--ac);transform-origin:left;transform:scaleX(0);z-index:80;transition:transform .2s}
body[data-cs=sharp]{--r:4px}body[data-cs=flat]{--r:0px;--gap:2px}
.cell{position:relative}.card{width:100%;display:block}
.cell.in{animation:cin .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*24ms)}
@keyframes cin{from{opacity:0;transform:translateY(14px)}}
.grid.sl{animation:sl .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{opacity:0;transform:translateX(var(--dx,0))}}
.card .pr{position:absolute;left:0;bottom:0;height:3px;background:var(--ac);z-index:1;border-radius:0 3px 3px 0}
.card .bd{position:absolute;top:8px;left:8px;z-index:1;background:var(--ac);color:#0a1411;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.card .bd.dn{background:var(--s2);color:var(--tx)}
.list .grid{grid-template-columns:1fr;gap:8px}
.list .card{display:flex;align-items:center;aspect-ratio:auto;height:78px;contain-intrinsic-size:auto 78px}
.list .card img,.list .card .ph{position:static;width:62px;height:100%;flex:none;background:var(--s2)}
.list .card .cap{position:static;background:none;padding:0 14px;flex:1;align-items:center;font-size:14px}
.list .card .bd{top:6px;left:6px}
.rak .grid{grid-template-columns:repeat(auto-fill,minmax(calc(var(--min,150px)*.72),1fr));column-gap:0;row-gap:26px}
.rak .cell{padding:0 7px 15px}
.rak .cell::after{content:"";position:absolute;left:0;right:0;bottom:0;height:13px;background:linear-gradient(#343b45,#191d22);box-shadow:0 8px 14px rgba(0,0,0,.55)}
.rak .card{aspect-ratio:2/3;border-radius:3px 7px 7px 3px;box-shadow:inset 3px 0 4px rgba(255,255,255,.08),3px 4px 10px rgba(0,0,0,.55)}
.rak .cap{padding-top:18px}.rak .cap i{display:none}.rak .cap em{-webkit-line-clamp:1;font-size:11px}
body[data-fab=center] #add{right:auto;left:50%;margin-left:-29px}
#app{transition:opacity .26s,transform .26s}#app.closing{opacity:0;transform:scale(.97)}
#lock{animation:fade .3s}
.shake{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;animation:fade .2s}
#sheet .pn{background:var(--s1);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:6px 18px calc(24px + var(--safe-b));max-height:88vh;overflow:auto;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.pn h3{font-size:13px;font-weight:500;color:var(--mu);margin:18px 0 8px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.seg button{padding:8px 14px;border-radius:99px;background:var(--s2);color:var(--mu);transition:background .2s,color .2s}
.seg button.on{background:var(--ac2);color:var(--ac)}
.pn .big{display:block;width:100%;padding:14px;border-radius:12px;background:var(--s2);margin-top:8px;text-align:left}
.pn .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13px}.pn .row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn small{color:var(--mu)}
.bar2{height:6px;border-radius:9px;background:var(--s2);overflow:hidden;margin:8px 0}.bar2 i{display:block;height:100%;background:var(--ac)}
#view{animation:none;background:var(--vbg,#07080a);overflow:hidden}
body[data-vbg=g]{--vbg:#181b20}body[data-vbg=b]{--vbg:#0a0b0d}
#vblur{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(38px) brightness(.38);z-index:0;display:none}
body[data-vbg=b] #vblur{display:block}
#vbody{position:absolute;inset:0;z-index:1}
#vbody.center{overflow:hidden;touch-action:none;align-items:center}
#vbar{position:absolute;top:0;left:0;right:0;z-index:3;background:linear-gradient(rgba(6,7,9,.88),transparent);padding-bottom:22px;transition:opacity .25s,transform .25s}
#stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#stage img.pre{opacity:.85}
#view.hid #vbar{opacity:0;transform:translateY(-100%);pointer-events:none}
.nv{position:absolute;top:50%;margin-top:-32px;z-index:3;width:42px;height:64px;border-radius:14px;background:rgba(20,22,26,.5);font-size:26px;transition:opacity .25s;backdrop-filter:blur(6px)}
#nvp{left:8px}#nvn{right:8px}
#pos{position:absolute;left:50%;bottom:calc(16px + var(--safe-b));transform:translateX(-50%);z-index:3;background:rgba(20,22,26,.62);padding:5px 14px;border-radius:99px;font-size:13px;transition:opacity .25s;backdrop-filter:blur(6px);pointer-events:none}
#view.med #pos{bottom:auto;top:calc(var(--safe-t) + 58px)}
#view.hid .nv,#view.hid #pos{opacity:0;pointer-events:none}
#view.hid.cm #pos{opacity:.8}
#pages img{width:100%;height:100%;max-height:none;display:block;object-fit:contain}
#endp{padding:44px 14px calc(44px + var(--safe-b));text-align:center}
#endp h2{font-size:24px;font-weight:600;letter-spacing:-.3px}#endp p{color:var(--mu);margin:4px 0 14px}
#endp h4{font-size:13px;color:var(--mu);font-weight:500;text-align:left;margin:26px 0 10px}
.eb{padding:11px 20px;border-radius:12px;background:var(--ac2);color:var(--ac);margin:4px}
.rrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.rc{flex:none;width:112px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;position:relative;background:var(--s1);text-align:left}
.rc img{width:100%;height:100%;object-fit:cover;display:block}
.rc .ph{position:absolute;inset:0;display:grid;place-items:center;color:#3a424c;font-size:30px}
.rc span{position:absolute;left:0;right:0;bottom:0;padding:20px 7px 6px;font-size:11px;line-height:1.2;background:linear-gradient(transparent,rgba(8,10,12,.92));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.noanim *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="bar" id="bar"></div>

<div id="lock">
  <div class="nf" id="nf"><h1 id="n404">404</h1><p>Halaman tidak ditemukan.</p></div>
  <form id="lf" class="hide" autocomplete="off">
    <small id="lmsg"></small>
    <input id="pw" type="password" placeholder="kata sandi" autocomplete="off">
    <input id="pw2" type="password" placeholder="ulangi kata sandi" class="hide" autocomplete="off">
    <button class="go" id="lgo">Buka</button>
  </form>
</div>

<div id="app" class="hide">
  <header>
    <div class="top"><b id="ttl">Koleksi</b><div><span id="cnt"></span><button id="setbtn">Atur</button><button id="lockbtn">Kunci</button></div></div>
    <div class="tabs" id="tabs">
      <button data-t="all" class="on">Semua</button><button data-t="image">Foto</button><button data-t="video">Video</button><button data-t="pdf">Komik</button>
    </div>
  </header>
  <main><div class="grid" id="grid"></div><div class="empty hide" id="empty"><b>Masih kosong</b>Tekan + untuk menambah foto, video, atau PDF komik.</div></main>
  <button id="add" aria-label="Tambah">+</button>
  <input id="file" type="file" multiple accept="image/*,video/*,application/pdf,.pdf,.zip,.cbz,application/zip" class="hide">
</div>

<div id="view" class="hide"><div id="vblur"></div><div id="vbody"></div>
  <div id="vbar"><button class="x" id="vx">✕</button><h2 id="vt"></h2><button id="vs" class="hide">Slideshow</button><button id="vr">Judul</button><button class="del" id="vd">Hapus</button></div>
  <button class="nv hide" id="nvp">‹</button><button class="nv hide" id="nvn">›</button><div id="pos"></div>
</div>
<input id="bfile" type="file" class="hide">
<div id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s), CH=2*1024*1024, PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const te=new TextEncoder(), td=new TextDecoder();
let KEY=null, items=[], tab='all', urls=[], curUrl=null, hideTimer=null;
/* ---------- pengaturan tampilan ---------- */
let S={vw:'grid',gs:'m',cs:'round',fab:'right',pw:'full',pgap:0,hap:1,anim:1,vbg:'k',ssd:5};
try{Object.assign(S,JSON.parse(localStorage.getItem('ui')||'{}'))}catch{}
const saveS=()=>{try{localStorage.setItem('ui',JSON.stringify(S))}catch{}};
function applyS(){const b=document.body;b.dataset.cs=S.cs;b.dataset.fab=S.fab;b.dataset.vbg=S.vbg;b.classList.toggle('list',S.vw==='list');b.classList.toggle('rak',S.vw==='rak');b.classList.toggle('noanim',!S.anim);
  b.style.setProperty('--min',{s:'105px',m:'150px',l:'230px'}[S.gs]);b.style.setProperty('--pg',S.pgap+'px')}
applyS();
const hap=n=>{if(S.hap&&navigator.vibrate)try{navigator.vibrate(n||8)}catch{}};
const fmt=n=>n>=1e9?(n/1e9).toFixed(2)+' GB':n>=1e6?(n/1e6).toFixed(1)+' MB':Math.max(1,Math.round(n/1e3))+' KB';
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sheet(html,bind){closeSheet();const s=document.createElement('div');s.id='sheet';s.innerHTML='<div class="pn">'+html+'</div>';s.onclick=e=>{if(e.target===s)closeSheet()};document.body.appendChild(s);bind&&bind(s.firstChild)}
function closeSheet(){const s=$('#sheet');s&&s.remove()}
const pick=a=>{const f=$('#file');f.accept=a;f.click()};
function sheetAdd(){sheet('<h3>Tambah</h3><button class="big" data-a="image/*">Foto</button><button class="big" data-a="video/*">Video</button><button class="big" data-a="application/pdf,.pdf,.zip,.cbz,application/zip">Komik (PDF / ZIP)</button>',
  pn=>pn.onclick=e=>{const b=e.target.closest('button');if(!b)return;hap(8);closeSheet();pick(b.dataset.a)})}
function openSettings(){
  const seg=(k,o)=>`<div class="seg">${o.map(([v,t])=>`<button data-k="${k}" data-v="${v}" class="${S[k]==v?'on':''}">${t}</button>`).join('')}</div>`;
  sheet(`<h3>Tampilan</h3>${seg('vw',[['grid','Grid'],['list','Daftar'],['rak','Rak buku']])}
<h3>Ukuran grid</h3>${seg('gs',[['s','Kecil'],['m','Sedang'],['l','Besar']])}
<h3>Gaya kartu</h3>${seg('cs',[['round','Bulat'],['sharp','Tajam'],['flat','Rapat']])}
<h3>Tombol tambah</h3>${seg('fab',[['right','Kanan'],['center','Tengah'],['menu','Menu']])}
<h3>Latar viewer</h3>${seg('vbg',[['k','Hitam'],['g','Abu gelap'],['b','Blur foto']])}
<h3>Slideshow</h3>${seg('ssd',[[3,'3 detik'],[5,'5 detik'],[8,'8 detik']])}
<h3>Pembaca komik</h3>${seg('pw',[['full','Lebar penuh'],['mid','Sedang'],['fit','Pas layar']])}${seg('pgap',[[0,'Tanpa jarak'],[8,'Jarak kecil'],[20,'Jarak besar']])}
<h3>Efek</h3>${seg('hap',[[1,'Getar aktif'],[0,'Getar mati']])}${seg('anim',[[1,'Animasi'],[0,'Tanpa animasi']])}
<h3>Penyimpanan</h3><div id="stor">Menghitung…</div>
<h3>Cadangan</h3><button class="big" id="bk">Ekspor cadangan terenkripsi</button><button class="big" id="bi">Impor cadangan</button>`,pn=>{
    pn.onclick=e=>{const b=e.target.closest('button');if(!b)return;hap(6);
      if(b.dataset.k){const k=b.dataset.k,v=b.dataset.v;S[k]=isNaN(v)?v:+v;saveS();applyS();[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b));if(['vw','gs','cs'].includes(k))render()}
      else if(b.id==='bk'){closeSheet();exportBackup()}else if(b.id==='bi')$('#bfile').click()};
    (async()=>{const st=navigator.storage,e=st&&st.estimate?await st.estimate():{},per=st&&st.persisted?await st.persisted():false,tot=items.reduce((a,x)=>a+x.size,0),
      big=[...items].sort((a,b)=>b.size-a.size).slice(0,3),q=e.quota||0,u=e.usage||0,el=pn.querySelector('#stor');if(!el)return;
      el.innerHTML=`${fmt(tot)} terkunci, ${items.length} item<div class="bar2"><i style="width:${q?Math.max(1,u/q*100):0}%"></i></div><small>Terpakai ${fmt(u)} dari ${fmt(q)}. ${per?'Penyimpanan permanen.':'Browser bisa menghapus jika memori penuh.'}</small>`+big.map(x=>`<div class="row"><span>${esc(x.title)}</span><span>${fmt(x.size)}</span></div>`).join('')})()})}

/* ---------- cadangan terenkripsi (.vault) ---------- */
const u32=n=>{const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,n);return b};
const rec=(h,bufs)=>{const hb=te.encode(JSON.stringify({...h,l:bufs.map(b=>b.byteLength)}));return new Blob([u32(hb.length),hb,...bufs])};
const eq=(a,b)=>{a=new Uint8Array(a);b=new Uint8Array(b);return a.length===b.length&&a.every((x,i)=>x===b[i])};
async function exportBackup(){try{toast('Menyiapkan cadangan…',60000);const auth=await get('cfg','auth'),parts=[te.encode('VLT1'),rec({t:'auth'},[auth.salt,auth.check])];
    for(const r of await all('meta')){const d=await get('data',r.id);if(d)parts.push(rec({t:'data',id:r.id},d.chunks));parts.push(rec({t:'meta',id:r.id},r.th?[r.m,r.th]:[r.m]))}
    for(const r of await all('cfg'))if(r.k.startsWith('prog:'))parts.push(rec({t:'prog',id:r.k.slice(5)},[r.v]));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(parts));a.download='notes-'+new Date().toISOString().slice(0,10)+'.vault';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);toast('Cadangan dibuat. Isinya tetap terenkripsi.',3800)}catch(e){console.error(e);toast('Gagal membuat cadangan',3000)}}
async function importBackup(file){try{toast('Membaca cadangan…',60000);if(td.decode(await file.slice(0,4).arrayBuffer())!=='VLT1')throw new Error('Bukan file cadangan');
    const cur=await get('cfg','auth'),have=new Set((await all('meta')).map(r=>r.id));let o=4,k2=KEY,n=0,skip=new Set();
    const rs=async b=>k2===KEY?b:await seal(await unseal(b,k2));
    while(o<file.size){const hl=new DataView(await file.slice(o,o+4).arrayBuffer()).getUint32(0);o+=4;const h=JSON.parse(td.decode(await file.slice(o,o+hl).arrayBuffer()));o+=hl;
      const bufs=[];for(const l of h.l){bufs.push(await file.slice(o,o+l).arrayBuffer());o+=l}
      if(h.t==='auth'){if(!eq(bufs[0],cur.salt)){const pw=prompt('Kata sandi untuk cadangan ini:');if(!pw)return toast('Dibatalkan');k2=await derive(pw,new Uint8Array(bufs[0]));try{await unseal(bufs[1],k2)}catch{return toast('Kata sandi cadangan salah',3000)}}}
      else if(h.t==='data'){if(have.has(h.id)){skip.add(h.id);continue}const ch=[];for(const b of bufs)ch.push(await rs(b));await put('data',{id:h.id,chunks:ch})}
      else if(h.t==='meta'){if(skip.has(h.id)||have.has(h.id))continue;await put('meta',{id:h.id,m:await rs(bufs[0]),th:bufs[1]?await rs(bufs[1]):null});n++}
      else if(h.t==='prog'){if(!(await get('cfg','prog:'+h.id)))await put('cfg',{k:'prog:'+h.id,v:await rs(bufs[0])})}}
    await load();toast(n+' item dipulihkan',3000)}catch(e){console.error(e);toast('Gagal impor: '+(e.message||'file rusak'),3500)}}
$('#bfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f){closeSheet();importBackup(f)}};


/* ---------- storage (IndexedDB, tidak muncul di galeri / file manager) ---------- */
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('cache-v2',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('cfg',{keyPath:'k'});d.createObjectStore('meta',{keyPath:'id'});d.createObjectStore('data',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

/* ---------- crypto: AES-GCM 256, kunci dari kata sandi (PBKDF2) ---------- */

const sealJSON=o=>seal(te.encode(JSON.stringify(o))), unsealJSON=async b=>JSON.parse(td.decode(await unseal(b)));

const clean=n=>n.replace(/\.[^.]+$/,'').replace(/[_\-.]+/g,' ').replace(/\s+/g,' ').trim()||'Tanpa judul';

const isZip=f=>/\.(zip|cbz)$/i.test(f.name)||f.type==='application/zip'||f.type==='application/x-cbz';

  s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';res()};s.onerror=()=>rej(new Error('pdf.js belum ter-cache, buka sekali saat online'));document.head.appendChild(s)})}

  try{await Promise.race([once(v,'loadeddata'),sleep(8000).then(()=>{throw 0})]);v.currentTime=Math.min(1,(v.duration||2)/10);
    await Promise.race([once(v,'seeked'),sleep(4000)]);const c=drawThumb(v,v.videoWidth,v.videoHeight);return {blob:await canvasBlob(c)}}

/* ---------- tambah file ---------- */
async function addFiles(list){const files=[...list];let i=0,fail=0;
  for(const f of files){i++;const k=kind(f);if(!k){fail++;continue}
    try{toast(`Mengunci ${i}/${files.length}…`,60000);$('#bar').style.transform=`scaleX(${(i-1)/files.length})`;
      const id=uid(),t=k==='image'?await thumbImage(f):k==='video'?await thumbVideo(f):isZip(f)?await thumbZip(f):await thumbPdf(f);
      const chunks=[];for(let o=0;o<f.size;o+=CH)chunks.push(await seal(await f.slice(o,o+CH).arrayBuffer()));
      const meta={title:t.title||clean(f.name),type:k,mime:(k==='pdf'&&isZip(f))?'application/zip':(f.type||'application/pdf'),size:f.size,added:Date.now(),pages:t.pages||0};
      await put('data',{id,chunks});
      await put('meta',{id,m:await sealJSON(meta),th:t.blob?await seal(await t.blob.arrayBuffer()):null});
    }catch(e){fail++;console.error(e)}}
  $('#bar').style.transform='scaleX(1)';setTimeout(()=>$('#bar').style.transform='scaleX(0)',400);
  toast(fail?`Selesai, ${fail} gagal`:'Tersimpan & terkunci. Hapus file asli dari galeri HP.',3600);await load()}

  body.addEventListener('pointerdown',e=>{dragMoved=false;if(!body.classList.contains('center')||!$('#stage'))return;if(e.target.tagName==='VIDEO'&&e.clientY>e.target.getBoundingClientRect().bottom-80)return;g={x:e.clientX,y:e.clientY,t:performance.now(),ax:0,dx:0,dy:0,id:e.pointerId}});

    else if(g.ax==='y'&&g.dy>0){const k=Math.min(g.dy/420,1);v.style.transform=`translateY(${g.dy}px) scale(${1-k*.1})`;v.style.opacity=1-k*.55}});

    if(d.ax==='x'&&V.list.length>1){if(Math.abs(d.dx)>70||Math.abs(d.dx)/dt>.45)step(d.dx<0?1:-1);else snap($('#stage'))}
    else if(d.ax==='y'){if(d.dy>110||(d.dy>40&&d.dy/dt>.6))closeView(true);else snap(v)}});
  body.addEventListener('pointercancel',()=>{if(g){g=null;snap($('#stage'));snap(v)}});
  body.addEventListener('click',e=>{if(dragMoved){dragMoved=false;return}if(e.target.closest('button,.rc,video,#endp'))return;v.classList.contains('hid')?showChrome():hideChrome()});
  document.addEventListener('keydown',e=>{if(v.classList.contains('hide')||$('#sheet'))return;if(e.key==='Escape')closeView();else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)})})();
$('#vx').onclick=()=>{hap(6);closeView()};$('#nvp').onclick=()=>step(-1);$('#nvn').onclick=()=>step(1);
$('#vs').onclick=()=>{V.slide=!V.slide;hap(8);$('#vs').textContent=V.slide?'Jeda':'Slideshow';clearTimeout(V.tm);if(V.slide){showChrome();if(cur.type==='image')slideTick();else{const x=$('#vbody video');x&&x.play()}}};
$('#vd').onclick=async()=>{if(!cur||!confirm('Hapus "'+cur.title+'" selamanya?'))return;const id=cur.id,med=cur.type!=='pdf',l=V.list,i=l.findIndex(x=>x.id===id);hap([20,30,20]);
  await del('meta',id);await del('data',id);try{await del('cfg','prog:'+id)}catch{}delete prog[id];items=items.filter(x=>x.id!==id);V.list=l.filter(x=>x.id!==id);
  if(med&&V.list.length)openItem(V.list[Math.min(i,V.list.length-1)],null,1);else closeView();render();toast('Dihapus')};
$('#vr').onclick=async()=>{if(!cur)return;const t=prompt('Judul baru',cur.title);if(!t||!t.trim())return;const r=await get('meta',cur.id),m=await unsealJSON(r.m);m.title=t.trim();r.m=await sealJSON(m);await put('meta',r);cur.title=m.title;$('#vt').textContent=m.title;render()};

/* ---------- tab, tambah ---------- */
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;const o=[...$('#tabs').children],n=o.indexOf(b),p=o.findIndex(x=>x.classList.contains('on'));if(n===p)return;hap(6);tab=b.dataset.t;o.forEach(x=>x.classList.toggle('on',x===b));render(n>p?1:-1)};
$('#add').onclick=()=>{hap(10);S.fab==='menu'?sheetAdd():pick('image/*,video/*,application/pdf,.pdf,.zip,.cbz,application/zip')};
$('#setbtn').onclick=()=>{hap(8);openSettings()};
$('#file').onchange=e=>{const l=[...e.target.files];e.target.value='';if(l.length)addFiles(l)};

/* ---------- kunci / buka ---------- */
let taps=0,tapT;
$('#n404').onclick=()=>{taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,900);if(taps>=3){showForm()}};
async function showForm(){const auth=await get('cfg','auth');$('#nf').classList.add('hide');$('#lf').classList.remove('hide');
  $('#pw2').classList.toggle('hide',!!auth);$('#lgo').textContent=auth?'Buka':'Buat kunci';$('#lmsg').textContent=auth?'':'Buat kata sandi. Jika lupa, data tidak bisa dipulihkan.';$('#pw').focus()}
$('#lf').onsubmit=async e=>{e.preventDefault();const pw=$('#pw').value;if(pw.length<4){$('#lmsg').textContent='Minimal 4 karakter';return}
  $('#lgo').disabled=true;const auth=await get('cfg','auth');
  try{if(!auth){if(pw!==$('#pw2').value){$('#lmsg').textContent='Kata sandi tidak sama';return}
      const salt=crypto.getRandomValues(new Uint8Array(16));KEY=await derive(pw,salt);await put('cfg',{k:'auth',salt:salt.buffer,check:await seal(te.encode('ok'))});
      if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}
    else{const k=await derive(pw,new Uint8Array(auth.salt));KEY=k;try{await unseal(auth.check)}catch{KEY=null;$('#lmsg').textContent='Salah';$('#pw').classList.remove('shake');void $('#pw').offsetWidth;$('#pw').classList.add('shake');hap([30,40,30]);$('#pw').value='';return}}
    $('#pw').value=$('#pw2').value='';$('#lock').classList.add('hide');$('#app').classList.remove('hide');await load()}
  finally{$('#lgo').disabled=false}};
function lockNow(){KEY=null;items=[];closeSheet();urls.forEach(URL.revokeObjectURL);urls=[];closeView(0,1);$('#grid').textContent='';$('#app').classList.add('hide');
  $('#lf').classList.add('hide');$('#nf').classList.remove('hide');$('#lock').classList.remove('hide');taps=0}
function lock(a){KEY=null;if(a&&S.anim&&!$('#app').classList.contains('hide')){$('#app').classList.add('closing');setTimeout(()=>{lockNow();$('#app').classList.remove('closing')},260)}else lockNow()}
$('#lockbtn').onclick=()=>{hap(12);lock(true)};
document.addEventListener('visibilitychange',()=>{if(document.hidden){hideTimer=setTimeout(()=>KEY&&lock(),30000)}else clearTimeout(hideTimer)});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
