<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Penyimpanan</title>
<style>
:root{--bg:#0d1117;--bg2:#151b24;--ln:#243040;--tx:#e9eef4;--mut:#8b9bad;--ac:#3ec6a8;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,sans-serif}
.w{max-width:900px;margin:0 auto;padding:20px}
h1{font-size:1.3rem;margin:0 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button,.btn{border:1px solid var(--ln);background:var(--bg2);color:var(--tx);padding:9px 16px;border-radius:99px;font:inherit;cursor:pointer;transition:all .2s}
.tabs button.on,.btn.p{background:var(--ac);color:#06201a;border-color:var(--ac);font-weight:600}
.btn:hover,.tabs button:hover{transform:translateY(-2px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.box{background:var(--bg2);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:16px}
label{display:block;color:var(--mut);font-size:.85rem;margin:4px 0}
input,select{width:100%;padding:10px;margin-bottom:8px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;font:inherit}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);animation:in .4s both}
.row img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#1d3b4a}
.row div{flex:1;min-width:0}.row small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{color:#ff7a7a}.hide{display:none}
#st{position:sticky;bottom:12px;background:var(--bg2);border:1px solid var(--ac);border-radius:var(--r);padding:10px 14px;margin-top:12px;transition:opacity .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="w">
<h1>Penyimpanan</h1>
<div class="tabs"><button class="on" data-t="v">Video</button><button data-t="a">Iklan</button><button data-t="s">Pengaturan</button></div>

<section id="v"><div class="box">
 <label>Judul</label><input id="vt">
 <label>URL video (.mp4 atau link YouTube / embed)</label><input id="vu">
 <label>Deskripsi (opsional)</label><input id="vd">
 <label>Thumbnail (opsional, kosongkan = otomatis)</label><input id="vf" type="file" accept="image/*">
 <button class="btn p" id="addV">Upload video</button></div><div id="lv"></div></section>

<section id="a" class="hide"><div class="box">
 <label>Posisi</label><select id="as"><option value="below">Di bawah player</option><option value="side">Sidebar</option></select>
 <label>Gambar iklan</label><input id="af" type="file" accept="image/*">
 <label>Link tujuan (https://...)</label><input id="al">
 <label>Teks iklan</label><input id="at">
 <button class="btn p" id="addA">Upload iklan</button></div><div id="la"></div></section>

<section id="s" class="hide"><div class="box">
 <label>Username GitHub</label><input id="co">
 <label>Nama repo penyimpanan</label><input id="cr" value="streaming-storage">
 <label>Branch</label><input id="cb" value="main">
 <label>Token GitHub (fine-grained, izin Contents: Read and write, hanya untuk repo ini)</label><input id="ct" type="password">
 <label>Nama web</label><input id="sn">
 <label>Username Telegram (tanpa @)</label><input id="sg">
 <button class="btn p" id="sv">Simpan pengaturan</button></div></section>
<div id="st">Siap.</div>
</div>
<script>
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var C=JSON.parse(localStorage.getItem("cfg")||"{}");
var D={site:"Nonton",telegram:"",videos:[],ads:[]},SHA=null;
function say(m){$("st").textContent=m}
function raw(n){return !n?"":/^https?:/.test(n)?n:"https://raw.githubusercontent.com/"+C.owner+"/"+C.repo+"/"+C.branch+"/img/"+n}

function api(path,opt){
 opt=opt||{};opt.headers={Accept:"application/vnd.github+json",Authorization:"Bearer "+C.token};
 opt.cache="no-store";
 return fetch("https://api.github.com/repos/"+C.owner+"/"+C.repo+"/contents/"+path,opt);
}
function b64(str){return btoa(unescape(encodeURIComponent(str)))}
function load(){
 if(!C.token){say("Isi dulu tab Pengaturan.");tab("s");return Promise.resolve()}
 say("Memuat data dari GitHub...");
 return api("data.json?ref="+C.branch).then(function(r){
  if(r.status===404){D={site:"Nonton",telegram:"",videos:[],ads:[]};SHA=null;return}
  if(!r.ok)throw new Error("Gagal memuat ("+r.status+"). Cek token dan nama repo.");
  return r.json().then(function(j){SHA=j.sha;D=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))))});
 }).then(function(){draw();say("Data dimuat.")}).catch(function(e){say(e.message)});
}
function save(msg){
 var body={message:msg,content:b64(JSON.stringify(D,null,1)),branch:C.branch};if(SHA)body.sha=SHA;
 return api("data.json",{method:"PUT",body:JSON.stringify(body)}).then(function(r){
  if(!r.ok)throw new Error("Gagal menyimpan ("+r.status+"). Muat ulang halaman lalu coba lagi.");
  return r.json()}).then(function(j){SHA=j.content.sha;draw()});
}
function putImg(name,data){
 return api("img/"+name,{method:"PUT",body:JSON.stringify({message:"upload "+name,content:data,branch:C.branch})})
 .then(function(r){if(!r.ok)throw new Error("Gagal upload gambar ("+r.status+")");return name});
}
function toJpg(src,w,h){
 var s=Math.min(1,640/w),c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
 c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.82).split(",")[1];
}
function fromFile(f){return new Promise(function(res,rej){
 var i=new Image();i.onload=function(){res(toJpg(i,i.naturalWidth,i.naturalHeight))};i.onerror=rej;i.src=URL.createObjectURL(f);
})}
function fromVideo(u){return new Promise(function(res,rej){
 var v=document.createElement("video");v.crossOrigin="anonymous";v.muted=true;v.preload="metadata";v.src=u;
 v.onloadedmetadata=function(){v.currentTime=Math.min(2,v.duration/2)};
 v.onseeked=function(){try{res(toJpg(v,v.videoWidth,v.videoHeight))}catch(e){rej(e)}};
 v.onerror=rej;setTimeout(rej,15000);
})}
function ytId(u){var m=u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);return m&&m[1]}
function uid(){return Date.now().toString(36)}

/* thumbnail otomatis: file pilihan > YouTube > frame video mp4 > kosong */
function makeThumb(file,url){
 if(file)return fromFile(file).then(function(d){return putImg("v"+uid()+".jpg",d)});
 var y=ytId(url);if(y)return Promise.resolve("https://img.youtube.com/vi/"+y+"/hqdefault.jpg");
 if(/\.(mp4|webm)(\?|$)/i.test(url))return fromVideo(url).then(function(d){return putImg("v"+uid()+".jpg",d)}).catch(function(){return ""});
 return Promise.resolve("");
}
$("addV").onclick=function(){
 var t=$("vt").value.trim(),u=$("vu").value.trim();
 if(!t||!/^https?:\/\//.test(u)){say("Isi judul dan URL video (https://...).");return}
 var y=ytId(u);if(y)u="https://www.youtube.com/embed/"+y;
 say("Mengupload...");
 makeThumb($("vf").files[0],u).then(function(img){
  D.videos.unshift({title:t,url:u,img:img,desc:$("vd").value.trim()});
  return save("tambah video: "+t);
 }).then(function(){["vt","vu","vd","vf"].forEach(function(i){$(i).value=""});say("Berhasil. Muncul di web penonton dalam beberapa menit.")})
 .catch(function(e){say(e.message||"Gagal.")});
};
$("addA").onclick=function(){
 var f=$("af").files[0],l=$("al").value.trim();
 if(!f||!/^https?:\/\//.test(l)){say("Pilih gambar dan isi link (https://...).");return}
 say("Mengupload...");
 fromFile(f).then(function(d){return putImg("a"+uid()+".jpg",d)}).then(function(n){
  D.ads.push({slot:$("as").value,img:n,link:l,text:$("at").value.trim()});return save("tambah iklan");
 }).then(function(){["af","al","at"].forEach(function(i){$(i).value=""});say("Iklan tersimpan.")})
 .catch(function(e){say(e.message||"Gagal.")});
};
function row(img,t,s,del){
 var r=el("div","row"),i=el("img");i.alt="";i.src=raw(img);i.onerror=function(){i.removeAttribute("src")};
 var d=el("div");d.appendChild(el("b","",t));d.appendChild(el("small","",s));
 var b=el("button","btn x","Hapus");b.onclick=del;r.append(i,d,b);return r;
}
function draw(){
 $("sn").value=D.site||"";$("sg").value=D.telegram||"";
 var lv=$("lv"),la=$("la");lv.textContent="";la.textContent="";
 D.videos.forEach(function(v,n){lv.appendChild(row(v.img,v.title,v.url,function(){D.videos.splice(n,1);save("hapus video").then(function(){say("Dihapus.")}).catch(function(e){say(e.message)})}))});
 D.ads.forEach(function(a,n){la.appendChild(row(a.img,a.text||"Iklan",a.slot+" · "+a.link,function(){D.ads.splice(n,1);save("hapus iklan").then(function(){say("Dihapus.")}).catch(function(e){say(e.message)})}))});
 if(!D.videos.length)lv.textContent="Belum ada video.";
 if(!D.ads.length)la.textContent="Belum ada iklan.";
}
$("sv").onclick=function(){
 C={owner:$("co").value.trim(),repo:$("cr").value.trim(),branch:$("cb").value.trim()||"main",token:$("ct").value.trim()};
 localStorage.setItem("cfg",JSON.stringify(C));
 load().then(function(){D.site=$("sn").value.trim()||"Nonton";D.telegram=$("sg").value.trim().replace("@","");return save("pengaturan")})
 .then(function(){say("Pengaturan tersimpan.")}).catch(function(e){say(e.message)});
};
function tab(k){
 document.querySelectorAll(".tabs button").forEach(function(x){x.classList.toggle("on",x.dataset.t===k)});
 ["v","a","s"].forEach(function(i){$(i).classList.toggle("hide",i!==k)});
}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){tab(b.dataset.t)}});
$("co").value=C.owner||"";$("cr").value=C.repo||"streaming-storage";$("cb").value=C.branch||"main";$("ct").value=C.token||"";
draw();load();
</script></body></html>
